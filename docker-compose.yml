# Local development stack (MASTER_PROMPT Phase 1).
#   docker compose up --build
# api      http://localhost:8000   (health: /healthz/ready, docs: /api/v1/docs)
# realtime ws://localhost:8001/ws/v1/ping/
# web      http://localhost:3000
# All credentials below are local-only placeholders, never used outside this file.

name: corridor

x-backend: &backend
  build:
    context: .
    dockerfile: docker/backend.Dockerfile
  image: corridor-backend:dev
  environment: &backend-env
    DJANGO_ENV: development
    DJANGO_DEBUG: "false"
    LOG_FORMAT: json
    # Runtime roles (D-007): corridor_app for requests and tasks, corridor_platform for the
    # audited Super Admin path. Neither owns tables nor bypasses RLS.
    DATABASE_URL: postgis://corridor_app:corridor_app_local@db:5432/corridor
    PLATFORM_DATABASE_URL: postgis://corridor_platform:corridor_platform_local@db:5432/corridor
    # Outbox relay (D-051): reads outbox_events across tenants, nothing else.
    RELAY_DATABASE_URL: postgis://corridor_relay:corridor_relay_local@db:5432/corridor
    # Local stand-in for Cognito (D-006); refused by settings outside development/test.
    AUTH_ISSUER_MODE: local
    LOCAL_ISSUER_KEY_FILE: /devauth/issuer_key.pem
    WEB_ALLOWED_ORIGINS: http://localhost:3000
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: sqs://local:local@elasticmq:9324
    SQS_IS_SECURE: "false"
    AWS_REGION: elasticmq
    AWS_ACCESS_KEY_ID: local
    AWS_SECRET_ACCESS_KEY: local
    SQS_QUEUE_PREFIX: corridor-development-
    SENTRY_DSN: ${SENTRY_DSN:-}
  volumes:
    # Shared signing key of the local issuer, so api and realtime accept the same tokens.
    - devauth:/devauth
  depends_on: &backend-deps
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
    elasticmq:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.7
    environment:
      POSTGRES_DB: corridor
      POSTGRES_USER: corridor
      POSTGRES_PASSWORD: corridor
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./backend/db:/corridor-db:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corridor -d corridor"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4.12-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  elasticmq:
    image: softwaremill/elasticmq-native:1.7.1
    ports: ["127.0.0.1:9324:9324"]
    volumes:
      - ./docker/elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      # Alpine image without bash: use busybox wget against the SQS ListQueues action.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9324/?Action=ListQueues"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    <<: *backend
    # Migrations run as corridor_migrator, which acts as corridor_owner (owns every object).
    environment:
      <<: *backend-env
      DATABASE_URL: postgis://corridor_migrator:corridor_migrator_local@db:5432/corridor
    command: ["python", "manage.py", "migrate", "--noinput"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    command: ["uvicorn", "config.asgi:application", "--host", "0.0.0.0", "--port", "8000",
              "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "*"]
    ports: ["127.0.0.1:8000:8000"]

  realtime:
    <<: *backend
    command: ["daphne", "-b", "0.0.0.0", "-p", "8001", "--proxy-headers", "config.asgi:application"]
    ports: ["127.0.0.1:8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 10s
      timeout: 3s
      retries: 10

  worker:
    <<: *backend
    command: ["celery", "-A", "config", "worker", "-Q", "default,events", "--loglevel", "INFO",
              "--concurrency", "2"]
    healthcheck:
      disable: true

  beat:
    <<: *backend
    command: ["celery", "-A", "config", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    image: corridor-web:dev
    environment:
      API_INTERNAL_URL: http://api:8000
      # OAuth 2.0 code + PKCE against the local issuer (Cognito hosted UI in AWS).
      AUTH_AUTHORIZE_URL: http://localhost:8000/dev-auth/authorize
      AUTH_TOKEN_URL: http://api:8000/dev-auth/token
      AUTH_LOGOUT_URL: http://localhost:8000/dev-auth/logout
      AUTH_CLIENT_ID_OFFICE: local-web-office
      AUTH_CLIENT_ID_PORTAL: local-web-portal
      APP_BASE_URL: http://localhost:3000
    ports: ["127.0.0.1:3000:3000"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  devauth:
