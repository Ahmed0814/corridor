[project]
name = "corridor-backend"
version = "0.1.0"
description = "Corridor logistics platform — Django modular monolith (api, realtime, worker, beat)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<6.0",
    "django-ninja>=1.4,<2.0",
    "django-environ>=0.12",
    "psycopg[binary]>=3.2",
    "channels>=4.2,<5.0",
    "channels-redis>=4.2",
    "daphne>=4.1",
    "uvicorn[standard]>=0.34",
    "celery[sqs]>=5.5,<6.0",
    "redis>=5.2",
    "structlog>=25.1",
    "sentry-sdk[django,celery]>=2.20",
    "django-stubs-ext>=5.1",
    "whitenoise>=6.8",
    "pyjwt[crypto]>=2.10",
    "boto3>=1.35",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.10",
    "pytest-asyncio>=0.25",
    "ruff>=0.9",
    "mypy>=1.15",
    "django-stubs[compatible-mypy]>=5.1",
    "celery-types>=0.23",
    "import-linter>=2.2",
    "pip-audit>=2.8",
    "pytest-env>=1.1",
]

[tool.uv]
package = false

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DJ", "RUF", "SIM", "T20"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501", "F811"]  # F811: shared pytest fixtures are imported by name
"**/tests/**" = ["S101", "S105", "S106"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true
warn_unused_ignores = true
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ.*", "channels.*", "channels_redis.*", "daphne.*", "kombu.*", "boto3.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*", "corridor.*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.django-stubs]
django_settings_module = "config.settings"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
# "D:" = default only: CI's environment variables win. These keep a stale local backend/.env from
# pointing tests at the wrong database role (tests must run as corridor_app).
env = [
    "DJANGO_ENV=test",
    "LOG_FORMAT=json",
    "D:DATABASE_URL=postgis://corridor_app:corridor_app_local@localhost:5432/corridor",
    "D:PLATFORM_DATABASE_URL=postgis://corridor_platform:corridor_platform_local@localhost:5432/corridor",
    "D:MIGRATOR_DATABASE_URL=postgis://corridor_migrator:corridor_migrator_local@localhost:5432/corridor",
]
testpaths = ["tests", "corridor"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "requires_redis: needs a reachable Redis (REDIS_URL). Skipped locally if unreachable; fails when REQUIRE_SERVICES=1.",
]

# ---------------------------------------------------------------- import-linter
# Module boundary rule (DECISIONS D-005): other modules may use <module>.services and
# <module>.schemas only. Contracts are generated in .importlinter by scripts/gen_importlinter.py.
