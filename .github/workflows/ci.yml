# Continuous integration (MASTER_PROMPT §7). Runs on every push and pull request.
# Deploy stages (ECR push, staging, approval, production) are added in Phase 7.
# Third-party actions are pinned to commit SHAs (tag in the trailing comment).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (lint, types, boundaries, migrations, tests)
    runs-on: ubuntu-24.04
    # Same OS and GDAL (3.10) as the production image; Ubuntu 24.04's GDAL 3.8 fails gis.W001.
    container:
      image: python:3.12.16-slim-trixie
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgis/postgis:16-3.7
        env:
          POSTGRES_DB: corridor
          POSTGRES_USER: corridor
          POSTGRES_PASSWORD: corridor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U corridor -d corridor"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.12-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      # Inside a job container, services are reached by their service name.
      DATABASE_URL: postgis://corridor:corridor@postgres:5432/corridor
      REDIS_URL: redis://redis:6379/0
      REQUIRE_SERVICES: "1"   # tests needing Redis fail instead of skipping
      UV_PYTHON_DOWNLOADS: never   # use the image's Python 3.12
    steps:
      - name: System packages (GDAL for GeoDjango, git for checkout and diff checks)
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends gdal-bin git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: GDAL version (must be >= 3.9)
        run: gdalinfo --version
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.12.12"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .
      - name: Module boundary contracts are up to date
        run: uv run python scripts/gen_importlinter.py && git diff --exit-code -- .importlinter
      - name: Module boundaries (import-linter)
        run: uv run lint-imports
      - name: Type check (mypy + django-stubs)
        run: uv run mypy .
      - name: Django system checks
        run: uv run python manage.py check --fail-level WARNING
      - name: No missing migrations
        run: uv run python manage.py makemigrations --check --dry-run
      - name: Tests (real PostGIS + Redis)
        run: uv run pytest
      - name: Dependency audit (pip-audit)
        run: uv run pip-audit --strict --skip-editable

  web:
    name: web (lint, types, tests, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Dependency audit
        run: npm audit --audit-level=high

  mobile:
    name: driver-mobile (types, expo-doctor)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/driver-mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/driver-mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx --yes expo-doctor@1.21.8
      - name: Dependency audit
        # Moderate minimatch advisory in Expo's build-time fingerprint tool is accepted
        # (PROGRESS.md, Phase 1); high/critical findings fail the build.
        run: npm audit --audit-level=high

  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --config /repo/.gitleaks.toml

  compose:
    name: docker compose up + smoke tests + image scan
    runs-on: ubuntu-24.04
    needs: [backend, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build images
        run: docker compose build
      - name: Start the stack
        run: docker compose up -d
      - name: Smoke tests
        run: ./scripts/smoke_compose.sh
      - name: Trivy scan (backend image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: corridor-backend:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Trivy scan (web image)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: corridor-web:dev
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
