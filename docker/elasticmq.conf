# Local SQS-compatible broker (DECISIONS D-009). Mirrors the AWS queue layout:
# a redrive policy sends a message to the DLQ after 5 failed receives.
include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  corridor-development-default {
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue { name = "corridor-development-dlq", maxReceiveCount = 5 }
  }
  corridor-development-events {
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 10 seconds
    deadLettersQueue { name = "corridor-development-dlq", maxReceiveCount = 5 }
  }
  corridor-development-dlq { }
}
